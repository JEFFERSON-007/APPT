# APPT Configuration File
# Modify these settings to customize behavior

[scanner]
# Default timeout in seconds
timeout = 2.0

# Default thread count
threads = 20

# Ports to scan in quick mode
quick_ports = 21,22,25,53,80,110,143,443,445,3306,3389,5900,8080,8443

[brute_force]
# Default timeout
timeout = 5.0

# Default thread count
threads = 10

# Delay between attempts (seconds)
delay = 0.1

# Default attack mode: single, loop, combo
attack_mode = loop

# Stop after first success
stop_on_success = false

[output]
# Default output format: json, csv, text
format = json

# Output directory
directory = output/

[logging]
# Verbose output
verbose = false

# Log file
log_file = output/appt.log
